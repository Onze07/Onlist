<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D14C"/>
      <stop offset="100%" stop-color="#48BF91"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>
  <!-- Yellow circle -->
  <circle cx="256" cy="256" r="148" fill="#F9D14C"/>
  <!-- Green border ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#3aad7a" stroke-width="28"/>
  <!-- White checkmark -->
  <polyline points="158,258 228,328 360,180"
    fill="none" stroke="white" stroke-width="54"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
